<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Sajal Kumar — AI, full-stack, Web3 and hardware builder</title>
<desc id="desc">A dark terminal-inspired banner with cyan circuit traces, a lime processor, and the words Ideas into code. Code into things you can use. Open to collaborations.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#18232E" stroke-width="0.7"/></pattern>
  <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#75E7F0"/><stop offset=".46" stop-color="#26343E"/><stop offset="1" stop-color="#C8FF79"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#164048" stop-opacity=".6"/><stop offset="1" stop-color="#0B1117" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .sans{font-family:Arial,Helvetica,sans-serif}
  .mono{font-family:Consolas,'Liberation Mono',monospace}
  .trace{stroke-dasharray:10 180;animation:flow 9s linear infinite}
  .cursor{animation:blink 1.4s steps(2,end) infinite}
  .signal{animation:signal 3s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-380}}
  @keyframes blink{50%{opacity:.15}}
  @keyframes signal{50%{opacity:.45}}
  @media(prefers-reduced-motion:reduce){.trace,.cursor,.signal{animation:none}}
</style>
